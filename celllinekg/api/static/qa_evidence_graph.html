<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CellLineKG QA Evidence Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #f4f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    header {
      padding: 20px 28px 14px;
      color: #ffffff;
      background: linear-gradient(120deg, #173a63, #176b87);
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      color: #dcecf4;
      font-size: 14px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(760px, 1fr) 360px;
      gap: 16px;
      padding: 16px;
    }

    .card {
      overflow: hidden;
      border: 1px solid #dce3ed;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(23, 32, 51, 0.06);
    }

    .query-card {
      grid-column: 1 / -1;
      padding: 16px;
    }

    .query-row {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 150px 110px;
      gap: 10px;
    }

    input, select, button {
      min-height: 42px;
      border-radius: 7px;
      font: inherit;
    }

    input, select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #bcc8d8;
      background: #ffffff;
    }

    button {
      border: 0;
      padding: 9px 16px;
      color: #ffffff;
      background: #176b87;
      cursor: pointer;
      font-weight: 650;
    }

    button:hover {
      background: #12566d;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .export-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .export-button {
      min-height: 34px;
      padding: 6px 12px;
      color: #24516a;
      border: 1px solid #9fb7c7;
      background: #eef7fa;
      font-size: 13px;
    }

    .export-button:hover:not(:disabled) {
      background: #dceef4;
    }

    .export-button:disabled {
      cursor: not-allowed;
    }

    .display-options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      color: #344258;
      font-size: 13px;
    }

    .display-options label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .display-options input {
      width: auto;
      min-height: auto;
    }

    #status {
      min-height: 20px;
      margin-top: 9px;
      color: #526176;
      font-size: 13px;
    }

    #status.error {
      color: #b42318;
    }

    #graph {
      position: relative;
      height: min(82vh, 880px);
      min-height: 720px;
      background: radial-gradient(circle at center, #ffffff 0, #f7f9fc 100%);
    }

    #empty-message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #6c788a;
      pointer-events: none;
    }

    #empty-message[hidden] {
      display: none;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-section {
      padding: 15px;
    }

    .panel-section h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .panel-section p {
      margin: 0;
      color: #344258;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    pre {
      max-height: 240px;
      margin: 0;
      overflow: auto;
      padding: 11px;
      border-radius: 7px;
      color: #d8e7ff;
      background: #172033;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .link {
      stroke: #8a99ad;
      stroke-width: 1.6px;
      marker-end: url(#arrowhead);
      cursor: ew-resize;
    }

    .link:hover,
    .link.active-edge {
      stroke: #176b87;
      stroke-width: 3px;
    }

    .edge-label {
      fill: #58677a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      cursor: ew-resize;
    }

    .edge-label.hidden {
      display: none;
    }

    .node circle {
      stroke: #8a99ad;
      stroke-width: 2.5px;
      filter: drop-shadow(0 2px 2px rgba(23, 32, 51, 0.22));
      cursor: pointer;
    }

    .node text {
      fill: #263449;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 650;
      pointer-events: none;
    }

    .legend {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      max-width: 190px;
      flex-direction: column;
      flex-wrap: nowrap;
      gap: 7px;
      padding: 8px 10px;
      border: 1px solid #dce3ed;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.92);
      font-size: 12px;
      pointer-events: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    @media (max-width: 1200px) {
      main {
        grid-template-columns: 1fr;
      }

      .query-row {
        grid-template-columns: 1fr;
      }

      #graph {
        height: 560px;
        min-height: 560px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>CellLineKG QA Evidence Graph</h1>
    <p>Ask a question, inspect the answer, and explore the Neo4j evidence used by the selected workflow.</p>
  </header>

  <main>
    <section class="card query-card">
      <div class="query-row">
        <input id="question" type="text" value="what is the ic50 of Temozolomide in TC-71" aria-label="Question">
        <select id="mode" aria-label="QA mode">
          <option value="auto">Auto</option>
          <option value="text2cypher">Text2Cypher</option>
          <option value="evidence_path_retrieval">Evidence-path retrieval</option>
        </select>
        <button id="run-button" type="button">Run QA</button>
      </div>
      <div class="export-row">
        <button id="download-svg" class="export-button" type="button" disabled>Download SVG</button>
        <button id="download-png" class="export-button" type="button" disabled>Download PNG (transparent)</button>
        <button id="download-pdf" class="export-button" type="button" disabled>Download PDF</button>
        <button id="download-json" class="export-button" type="button" disabled>Download JSON</button>
      </div>
      <div class="display-options">
        <label>
          <input id="show-edge-labels" type="checkbox" checked>
          Show edge labels
        </label>
      </div>
      <div id="status">Ready.</div>
    </section>

    <section class="card">
      <div id="graph">
        <div id="empty-message">Run a question to display its evidence graph.</div>
        <div id="legend" class="legend" hidden></div>
      </div>
    </section>

    <aside class="side-panel">
      <section class="card panel-section">
        <h2>Answer</h2>
        <p id="answer">No answer yet.</p>
      </section>

      <section class="card panel-section">
        <h2>Selected node</h2>
        <pre id="node-details">Click a node to inspect its properties.</pre>
      </section>

      <section class="card panel-section">
        <h2>Cypher</h2>
        <pre id="cypher">No query yet.</pre>
      </section>
    </aside>
  </main>

  <script>
    const TYPE_COLORS = {
      CellLine: "#0067C5",
      Drug: "#E00034",
      DrugScreen: "#FF8C00",
      Gene: "#008A45",
      Protein: "#00A9CE",
      Disease: "#A23BBA",
      Subtype: "#FF4FA3",
      Lineage: "#6F7C00",
      Variant: "#F4C300",
      GeneExpression: "#00BFA6",
      Dependency: "#3D3D3D",
      CopyNumber: "#9C5A20",
      ProteinAbundance: "#5B4BDB",
      Media: "#8FD14F"
    };

    const questionInput = document.getElementById("question");
    const modeSelect = document.getElementById("mode");
    const runButton = document.getElementById("run-button");
    const downloadSvgButton = document.getElementById("download-svg");
    const downloadPngButton = document.getElementById("download-png");
    const downloadPdfButton = document.getElementById("download-pdf");
    const downloadJsonButton = document.getElementById("download-json");
    const statusElement = document.getElementById("status");
    const answerElement = document.getElementById("answer");
    const cypherElement = document.getElementById("cypher");
    const nodeDetailsElement = document.getElementById("node-details");
    const emptyMessage = document.getElementById("empty-message");
    const legendElement = document.getElementById("legend");
    const showEdgeLabelsInput = document.getElementById("show-edge-labels");

    let simulation = null;
    let latestGraph = null;
    let latestEdgeLabelSelection = null;

    runButton.addEventListener("click", runQuestion);
    downloadSvgButton.addEventListener("click", downloadSVG);
    downloadPngButton.addEventListener("click", downloadPNG);
    downloadPdfButton.addEventListener("click", downloadPDF);
    downloadJsonButton.addEventListener("click", downloadJSON);
    showEdgeLabelsInput.addEventListener("change", updateEdgeLabelVisibility);
    questionInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        runQuestion();
      }
    });

    async function runQuestion() {
      const question = questionInput.value.trim();
      if (!question) {
        setStatus("Enter a question before running QA.", true);
        return;
      }

      runButton.disabled = true;
      setExportAvailability(false, false);
      setStatus("Running QA and collecting graph evidence...");
      answerElement.textContent = "Waiting for the answer...";
      cypherElement.textContent = "Waiting for the query...";
      nodeDetailsElement.textContent = "Click a node to inspect its properties.";

      try {
        const response = await fetch("/qa/evidence-graph", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            question: question,
            mode: modeSelect.value,
            include_debug: false
          })
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || `Request failed with status ${response.status}`);
        }

        answerElement.textContent = payload.answer || "No answer returned.";
        cypherElement.textContent = payload.cypher || "No Cypher query returned.";
        latestGraph = payload.graph || {nodes: [], edges: []};
        renderGraph(latestGraph);

        const nodeCount = latestGraph.nodes?.length || 0;
        const edgeCount = latestGraph.edges?.length || 0;
        setExportAvailability(nodeCount > 0, true);
        const warning = payload.graph_warning ? ` Warning: ${payload.graph_warning}` : "";
        setStatus(`${payload.workflow}: ${nodeCount} nodes, ${edgeCount} edges.${warning}`, Boolean(warning));
      } catch (error) {
        latestGraph = null;
        setExportAvailability(false, false);
        clearGraph();
        answerElement.textContent = "The request did not complete.";
        cypherElement.textContent = "No query returned.";
        setStatus(error.message || String(error), true);
      } finally {
        runButton.disabled = false;
      }
    }

    function renderGraph(graph) {
      clearGraph();

      // Copy input because D3 adds position fields and replaces edge IDs with node objects.
      const nodes = (graph.nodes || []).map(node => ({...node}));
      const edges = (graph.edges || []).map(edge => ({
        ...edge,
        manualDistance: edge.manualDistance || 220,
        defaultDistance: 220
      }));
      if (!nodes.length) {
        emptyMessage.textContent = "The answer succeeded, but no graph evidence was returned.";
        emptyMessage.hidden = false;
        return;
      }

      emptyMessage.hidden = true;
      renderLegend(nodes);

      const container = document.getElementById("graph");
      const width = container.clientWidth;
      const height = container.clientHeight;
      const svg = d3.select(container)
        .insert("svg", ":first-child")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [0, 0, width, height]);

      svg.append("defs")
        .append("marker")
        .attr("id", "arrowhead")
        .attr("viewBox", "0 -5 10 10")
        .attr("refX", 23)
        .attr("refY", 0)
        .attr("markerWidth", 6)
        .attr("markerHeight", 6)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M0,-5L10,0L0,5")
        .attr("fill", "#8a99ad");

      const zoomLayer = svg.append("g");
      const zoomBehavior = d3.zoom()
        .scaleExtent([0.25, 4])
        .on("zoom", event => zoomLayer.attr("transform", event.transform));
      svg.call(zoomBehavior);

      const link = zoomLayer.append("g")
        .selectAll("line")
        .data(edges)
        .join("line")
        .attr("class", "link")
        .on("dblclick", (event, edge) => {
          event.stopPropagation();
          edge.manualDistance = edge.defaultDistance;
          restartSimulationForEdgeChange();
        });

      const edgeLabel = zoomLayer.append("g")
        .selectAll("text")
        .data(edges)
        .join("text")
        .attr("class", "edge-label")
        .attr("text-anchor", "middle")
        .text(edge => edge.type)
        .on("dblclick", (event, edge) => {
          event.stopPropagation();
          edge.manualDistance = edge.defaultDistance;
          restartSimulationForEdgeChange();
        });
      latestEdgeLabelSelection = edgeLabel;
      updateEdgeLabelVisibility();

      const node = zoomLayer.append("g")
        .selectAll("g")
        .data(nodes)
        .join("g")
        .attr("class", "node")
        .on("click", (event, selectedNode) => {
          event.stopPropagation();
          nodeDetailsElement.textContent = JSON.stringify(selectedNode, null, 2);
        })
        .on("dblclick", (event, selectedNode) => {
          event.stopPropagation();
          selectedNode.fx = null;
          selectedNode.fy = null;
          simulation.alpha(0.35).restart();
        });

      node.append("circle")
        .attr("r", 15)
        .attr("fill", item => colorForType(item.type));

      node.append("text")
        .attr("x", 24)
        .attr("y", -18)
        .text(item => truncateLabel(item.label, 32));

      const linkForce = d3.forceLink(edges)
        .id(item => item.id)
        .distance(edge => edge.manualDistance || 220)
        .strength(0.45);

      simulation = d3.forceSimulation(nodes)
        .force("link", linkForce)
        .force("charge", d3.forceManyBody().strength(-820))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(82))
        .on("tick", () => {
          link
            .attr("x1", item => item.source.x)
            .attr("y1", item => item.source.y)
            .attr("x2", item => item.target.x)
            .attr("y2", item => item.target.y);

          edgeLabel
            .attr("x", item => (item.source.x + item.target.x) / 2)
            .attr("y", item => (item.source.y + item.target.y) / 2 - 5);

          node.attr("transform", item => `translate(${item.x},${item.y})`);
        });

      simulation.on("end", () => fitGraphToView(svg, zoomBehavior, nodes, width, height));
      window.setTimeout(() => fitGraphToView(svg, zoomBehavior, nodes, width, height), 900);

      const edgeDrag = d3.drag()
        .on("start", (event, edge) => {
          if (!event.active) simulation.alphaTarget(0.25).restart();
          d3.select(event.sourceEvent?.target).classed("active-edge", true);
          edge.dragStartX = event.x;
          edge.dragStartY = event.y;
          edge.dragStartDistance = edge.manualDistance || edge.defaultDistance;
        })
        .on("drag", (event, edge) => {
          const deltaX = event.x - edge.dragStartX;
          const deltaY = event.y - edge.dragStartY;
          const dragDistance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
          const direction = Math.abs(deltaX) >= Math.abs(deltaY) ? Math.sign(deltaX || 1) : Math.sign(deltaY || 1);
          edge.manualDistance = Math.max(60, Math.min(620, edge.dragStartDistance + direction * dragDistance));
          linkForce.distance(item => item.manualDistance || 220);
          simulation.alpha(0.35).restart();
        })
        .on("end", event => {
          if (!event.active) simulation.alphaTarget(0);
          d3.selectAll(".active-edge").classed("active-edge", false);
        });

      link.call(edgeDrag);
      edgeLabel.call(edgeDrag);

      function restartSimulationForEdgeChange() {
        linkForce.distance(edge => edge.manualDistance || 220);
        simulation.alpha(0.4).restart();
      }

      node.call(
        d3.drag()
          .on("start", (event, item) => {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            item.fx = item.x;
            item.fy = item.y;
          })
          .on("drag", (event, item) => {
            item.fx = event.x;
            item.fy = event.y;
          })
          .on("end", (event, item) => {
            if (!event.active) simulation.alphaTarget(0);
            item.fx = event.x;
            item.fy = event.y;
          })
      );
    }

    function clearGraph() {
      if (simulation) {
        simulation.stop();
        simulation = null;
      }
      d3.select("#graph").select("svg").remove();
      legendElement.replaceChildren();
      legendElement.hidden = true;
      latestEdgeLabelSelection = null;
      emptyMessage.hidden = false;
    }

    function updateEdgeLabelVisibility() {
      if (!latestEdgeLabelSelection) {
        return;
      }
      latestEdgeLabelSelection.classed("hidden", !showEdgeLabelsInput.checked);
    }

    function renderLegend(nodes) {
      const types = [...new Set(nodes.map(node => node.type))].sort();
      legendElement.replaceChildren();
      for (const type of types) {
        const item = document.createElement("span");
        item.className = "legend-item";

        const dot = document.createElement("span");
        dot.className = "legend-dot";
        dot.style.background = colorForType(type);

        const label = document.createElement("span");
        label.textContent = type;

        item.append(dot, label);
        legendElement.append(item);
      }
      legendElement.hidden = false;
    }

    function colorForType(type) {
      if (TYPE_COLORS[type]) {
        return TYPE_COLORS[type];
      }
      let hash = 0;
      for (const character of String(type)) {
        hash = character.charCodeAt(0) + ((hash << 5) - hash);
      }
      return `hsl(${Math.abs(hash) % 360} 55% 58%)`;
    }

    function truncateLabel(value, maximumLength) {
      const label = String(value || "Node");
      return label.length > maximumLength ? `${label.slice(0, maximumLength - 1)}…` : label;
    }

    function fitGraphToView(svg, zoomBehavior, nodes, width, height) {
      if (!nodes.length) {
        return;
      }

      // Input: current D3 node positions. Output: a centered zoom transform.
      const padding = 100;
      const minX = d3.min(nodes, node => node.x) - padding;
      const maxX = d3.max(nodes, node => node.x) + padding;
      const minY = d3.min(nodes, node => node.y) - padding;
      const maxY = d3.max(nodes, node => node.y) + padding;
      const graphWidth = Math.max(1, maxX - minX);
      const graphHeight = Math.max(1, maxY - minY);
      const scale = Math.min(1.6, Math.max(0.35, 0.88 / Math.max(graphWidth / width, graphHeight / height)));
      const translateX = (width - graphWidth * scale) / 2 - minX * scale;
      const translateY = (height - graphHeight * scale) / 2 - minY * scale;
      const transform = d3.zoomIdentity.translate(translateX, translateY).scale(scale);

      svg.transition()
        .duration(450)
        .call(zoomBehavior.transform, transform);
    }

    function setStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.classList.toggle("error", isError);
    }

    function setExportAvailability(hasVisualGraph, hasGraphData) {
      downloadSvgButton.disabled = !hasVisualGraph;
      downloadPngButton.disabled = !hasVisualGraph;
      downloadPdfButton.disabled = !hasVisualGraph;
      downloadJsonButton.disabled = !hasGraphData;
    }

    function createExportSVG() {
      const sourceSvg = document.querySelector("#graph svg");
      if (!sourceSvg) {
        return null;
      }

      const exportedSvg = sourceSvg.cloneNode(true);
      exportedSvg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      exportedSvg.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");

      replaceExportLinksWithPaths(exportedSvg);
      exportedSvg.querySelectorAll(".edge-label").forEach(label => {
        label.setAttribute("fill", "#58677a");
        label.setAttribute("font-family", "Arial, Helvetica, sans-serif");
        label.setAttribute("font-size", "12");
        label.setAttribute("font-weight", "400");
        if (label.classList.contains("hidden")) {
          label.setAttribute("display", "none");
        }
      });
      exportedSvg.querySelectorAll(".node circle").forEach(circle => {
        circle.setAttribute("stroke", "#8a99ad");
        circle.setAttribute("stroke-width", "2.5");
      });
      exportedSvg.querySelectorAll(".node text").forEach(label => {
        label.setAttribute("fill", "#263449");
        label.setAttribute("font-family", "Arial, Helvetica, sans-serif");
        label.setAttribute("font-size", "12");
        label.setAttribute("font-weight", "700");
      });

      // Embed styles because page-level CSS is not included in a standalone SVG file.
      const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
      style.textContent = `
        .edge-label { fill: #58677a; font: 12px Arial, Helvetica, sans-serif; }
        .edge-label.hidden { display: none; }
        .node circle { stroke: #8a99ad; stroke-width: 2.5px; }
        .node text { fill: #263449; font: 650 12px Arial, Helvetica, sans-serif; }
      `;
      exportedSvg.insertBefore(style, exportedSvg.firstChild);

      // Add an SVG-native legend so it remains available in both SVG and PNG exports.
      const width = Number(exportedSvg.getAttribute("width")) || 1200;
      const legend = createExportLegend(width);
      if (legend) {
        exportedSvg.appendChild(legend);
      }
      return exportedSvg;
    }

    /**
     * Convert SVG lines and marker arrows into Illustrator-compatible paths.
     *
     * Arg: exportedSvg - The cloned SVG element prepared for file export.
     *
     * Returns: undefined. The cloned SVG is updated in place.
     */
    function replaceExportLinksWithPaths(exportedSvg) {
      const namespace = "http://www.w3.org/2000/svg";
      const nodeRadius = 18;
      const arrowLength = 10;
      const arrowHalfWidth = 5;

      exportedSvg.querySelectorAll(".link").forEach(link => {
        const x1 = Number(link.getAttribute("x1"));
        const y1 = Number(link.getAttribute("y1"));
        const x2 = Number(link.getAttribute("x2"));
        const y2 = Number(link.getAttribute("y2"));
        const length = Math.hypot(x2 - x1, y2 - y1);
        if (!Number.isFinite(length) || length === 0) {
          link.remove();
          return;
        }

        const unitX = (x2 - x1) / length;
        const unitY = (y2 - y1) / length;
        const tipX = x2 - unitX * nodeRadius;
        const tipY = y2 - unitY * nodeRadius;
        const baseX = tipX - unitX * arrowLength;
        const baseY = tipY - unitY * arrowLength;
        const perpendicularX = -unitY * arrowHalfWidth;
        const perpendicularY = unitX * arrowHalfWidth;

        const edgePath = document.createElementNS(namespace, "path");
        edgePath.setAttribute("d", `M ${x1} ${y1} L ${tipX} ${tipY}`);
        edgePath.setAttribute("fill", "none");
        edgePath.setAttribute("stroke", "#8a99ad");
        edgePath.setAttribute("stroke-width", "1.6");

        const arrowPath = document.createElementNS(namespace, "path");
        arrowPath.setAttribute(
          "d",
          `M ${tipX} ${tipY} L ${baseX + perpendicularX} ${baseY + perpendicularY} ` +
          `L ${baseX - perpendicularX} ${baseY - perpendicularY} Z`
        );
        arrowPath.setAttribute("fill", "#8a99ad");
        arrowPath.setAttribute("stroke", "none");

        link.before(edgePath, arrowPath);
        link.remove();
      });

      exportedSvg.querySelector("#arrowhead")?.remove();
    }

    function createExportLegend(svgWidth) {
      if (!latestGraph?.nodes?.length) {
        return null;
      }

      const namespace = "http://www.w3.org/2000/svg";
      const types = [...new Set(latestGraph.nodes.map(node => node.type))].sort();
      const legend = document.createElementNS(namespace, "g");
      legend.setAttribute("class", "export-legend");

      const outerY = 14;
      const innerPadding = 10;
      const rowHeight = 24;
      const legendWidth = 168;
      const outerX = Math.max(14, svgWidth - legendWidth - 14);
      let itemY = 0;

      for (const type of types) {
        const item = document.createElementNS(namespace, "g");
        item.setAttribute(
          "transform",
          `translate(${outerX + innerPadding},${outerY + innerPadding + itemY})`
        );

        const dot = document.createElementNS(namespace, "circle");
        dot.setAttribute("cx", "6");
        dot.setAttribute("cy", "7");
        dot.setAttribute("r", "6");
        dot.setAttribute("fill", colorForType(type));

        const label = document.createElementNS(namespace, "text");
        label.setAttribute("x", "18");
        label.setAttribute("y", "8");
        label.setAttribute("fill", "#172033");
        label.setAttribute("font-family", "Arial, Helvetica, sans-serif");
        label.setAttribute("font-size", "13");
        label.setAttribute("dominant-baseline", "middle");
        label.textContent = type;

        item.append(dot, label);
        legend.appendChild(item);
        itemY += rowHeight;
      }

      const background = document.createElementNS(namespace, "rect");
      background.setAttribute("x", String(outerX));
      background.setAttribute("y", String(outerY));
      background.setAttribute("width", String(legendWidth));
      background.setAttribute("height", String(itemY + innerPadding));
      background.setAttribute("rx", "8");
      background.setAttribute("fill", "#ffffff");
      background.setAttribute("fill-opacity", "0.9");
      background.setAttribute("stroke", "#d5dfeb");
      legend.insertBefore(background, legend.firstChild);
      return legend;
    }

    function downloadSVG() {
      const exportedSvg = createExportSVG();
      if (!exportedSvg) {
        setStatus("No visual graph is available for SVG export.", true);
        return;
      }

      const source = new XMLSerializer().serializeToString(exportedSvg);
      downloadBlob(
        new Blob([source], {type: "image/svg+xml;charset=utf-8"}),
        `${exportFileStem()}.svg`
      );
    }

    function downloadPNG() {
      const exportedSvg = createExportSVG();
      if (!exportedSvg) {
        setStatus("No visual graph is available for PNG export.", true);
        return;
      }

      const width = Number(exportedSvg.getAttribute("width")) || 1200;
      const height = Number(exportedSvg.getAttribute("height")) || 700;
      const source = new XMLSerializer().serializeToString(exportedSvg);
      const svgUrl = URL.createObjectURL(
        new Blob([source], {type: "image/svg+xml;charset=utf-8"})
      );
      const image = new Image();

      image.onload = () => {
        const scale = 2;
        const canvas = document.createElement("canvas");
        canvas.width = width * scale;
        canvas.height = height * scale;
        const context = canvas.getContext("2d");
        context.scale(scale, scale);
        context.drawImage(image, 0, 0, width, height);
        URL.revokeObjectURL(svgUrl);
        canvas.toBlob(blob => {
          if (blob) {
            downloadBlob(blob, `${exportFileStem()}.png`);
          }
        }, "image/png");
      };

      image.onerror = () => {
        URL.revokeObjectURL(svgUrl);
        setStatus("PNG export failed while rendering the SVG.", true);
      };
      image.src = svgUrl;
    }

    function downloadPDF() {
      const exportedSvg = createExportSVG();
      if (!exportedSvg) {
        setStatus("No visual graph is available for PDF export.", true);
        return;
      }

      const source = new XMLSerializer().serializeToString(exportedSvg);
      const printWindow = window.open("", "_blank");
      if (!printWindow) {
        setStatus("Allow pop-ups for this page to export the graph as PDF.", true);
        return;
      }

      // Input: standalone SVG source. Output: browser print dialog for vector PDF saving.
      printWindow.document.write(`
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>${exportFileStem()}</title>
          <style>
            @page { size: landscape; margin: 12mm; }
            body { margin: 0; background: transparent; }
            svg { width: 100%; height: auto; display: block; }
          </style>
        </head>
        <body>${source}</body>
        </html>
      `);
      printWindow.document.close();
      printWindow.focus();
      printWindow.setTimeout(() => printWindow.print(), 250);
    }

    function downloadJSON() {
      if (!latestGraph) {
        setStatus("No graph data is available for JSON export.", true);
        return;
      }

      const source = JSON.stringify(latestGraph, null, 2);
      downloadBlob(
        new Blob([source], {type: "application/json;charset=utf-8"}),
        `${exportFileStem()}.json`
      );
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function exportFileStem() {
      const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
      return `celllinekg-evidence-${timestamp}`;
    }
  </script>
</body>
</html>
